<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankomat Clicker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tutorial.css">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="top-announcement" class="top-announcement"></div>
  <div id="boss-feed" class="boss-feed"></div>
  <div id="hud-top-left">
    <div id="money-label">🏦 Wspólna pula czatu</div>
    <div id="money">0 zł</div>
    <div id="income">0 / 100 klików do awansu</div>
    <div id="combo" style="display:none;"></div>
    <div id="widz-plakietka">👁 Tryb widza - podgląd na żywo</div>
    <div id="hud-top-left-buttons">
      <button id="btn-spawn-vanessa" title="Zrespij złodziejkę Vanessę natychmiast">🦹‍♀️ Zresp Vanessę</button>
      <button id="btn-spawn-boss" title="Odpal walkę z bossem Kamilem Kovalenko (test)">👹 Zresp bossa</button>
      <button id="btn-instakill-boss" title="Natychmiast pokonaj aktualnego bossa (tylko właściciel)">⚡ Zabij bossa</button>
      <button id="btn-spawn-wilkolak" title="Odpal walkę z bossem Wilkołakiem, tier 5 (test)">🐺 Zresp wilkołaka</button>
      <button id="btn-wilkolak-faza2" title="Ustaw HP Wilkołaka na 50 - próg Fazy 2/Przejścia (test)">🩸 Faza 2 (test)</button>
      <div id="eliminacja-wrap">
        <button id="btn-eliminacja" title="Wyeliminuj wybranego widza z rankingu (skutek jak trafienie rakietą bossa)">💀 Eliminacja</button>
        <div id="eliminacja-panel" hidden>
          <div id="eliminacja-panel-title">Wybierz widza do eliminacji</div>
          <div id="eliminacja-lista"></div>
        </div>
      </div>
      <button id="reset-btn" title="Reset gry">Reset gry</button>
      <button id="btn-admin" title="Zaloguj sie jako wlasciciel gry">🔑 Zaloguj</button>
      <button id="btn-noc" title="Przelacz tryb nocy (tylko u Ciebie, w tej przegladarce)">🌙 Noc</button>
      <div id="audio-controls" title="Głośność dźwięków gry">
        <button id="btn-mute" title="Wycisz / włącz dźwięk">🔊</button>
        <input id="volume-slider" type="range" min="0" max="100" step="1" value="80" title="Głośność">
      </div>
    </div>
  </div>

  <div id="floaters"></div>
  <div id="worker-overlays"></div>

  <div id="leaderboard-panel">
    <div id="leaderboard-header" class="floating-header" title="Chwyć i przeciągnij okno rankingu">
      <div id="leaderboard-title"><span class="drag-grip">⋮⋮</span> 🏆 TOP 10 WIDZÓW</div>
      <button id="leaderboard-toggle-btn" title="Zwiń / Rozwiń ranking">–</button>
    </div>
    <div id="leaderboard-body">
      <div id="leaderboard-list"></div>
    </div>
  </div>

  <div id="kick-panel">
    <div id="kick-header" class="floating-header" title="Chwyć i przeciągnij okno czatu">
      <div id="kick-channel-info">
        <span class="drag-grip">⋮⋮</span>
        <span id="kick-status-dot" class="status-connecting" title="Łączenie..."></span>
        <span id="kick-logo">KICK</span>
        <a href="https://kick.com/patiro" target="_blank" rel="noopener" id="kick-channel-link">/patiro</a>
      </div>
      <div id="kick-stats">
        <span id="kick-kliks-badge">0 klików</span>
        <button id="kick-toggle-btn" title="Minimalizuj czat">–</button>
      </div>
    </div>
    <div id="kick-body">
      <div id="kick-messages"></div>
      <div id="kick-footer-tip">Każda wiadomość na czacie to <span class="tip-klik">klik</span> w bankomat!</div>
    </div>
  </div>

  <!-- Kontener guzikow gornego prawego rogu: obok linku do czatu Kicka
       dochodzi guzik "Wlacz chodzenie wsadem" (patrz src/wasd-guzik.js).
       Pozycjonowanie top/right przeniesione tu z #kick-chat-btn, zeby oba
       guziki ustawialy sie w rzad flexem bez nachodzenia na siebie. -->
  <div id="top-right-buttons" style="position: absolute; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; pointer-events: none;">
    <button id="legenda-btn" type="button"
       title="Skiny: lista nazw i komenda !skin"
       style="pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(83, 252, 24, 0.14); color: #53fc18; border: 1px solid rgba(83, 252, 24, 0.45); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(83, 252, 24, 0.08); backdrop-filter: blur(6px); cursor: pointer;">🎭 Skiny</button>

    <button id="wasd-guzik-btn" type="button"
       title="Pokaz instrukcje wlaczenia sterowania WASD z czatu Kicka"
       style="pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(83, 252, 24, 0.14); color: #53fc18; border: 1px solid rgba(83, 252, 24, 0.45); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(83, 252, 24, 0.08); backdrop-filter: blur(6px); cursor: pointer;">Włącz chodzenie wsadem</button>

    <!-- Zastepuje dawny osadzony panel czatu (iframe) - wlasciciel uznal ramke
         za zbedna. Zostaje wylacznie link otwierajacy oficjalny popout Kicka w
         osobnym oknie. To <a>, nie <button>: dziala nawet bez JS (href sam w
         sobie otwiera popout), a JS tylko dokleja rozmiar okienka i, gdy sie
         uda, podmienia domyslna nawigacje na window.open. target z nazwa
         ('kick-czat-patiro') sprawia, ze kolejne kliknicia wracaja do tego
         samego okna zamiast mnozyc karty/okna. -->
    <a id="kick-chat-btn" href="https://kick.com/popout/patiro/chat" target="kick-czat-patiro" rel="noopener"
       title="Otworz czat Kicka (kanal patiro) w osobnym oknie"
       style="pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(83, 252, 24, 0.14); color: #53fc18; border: 1px solid rgba(83, 252, 24, 0.45); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(83, 252, 24, 0.08); backdrop-filter: blur(6px);">
      💬 Czat Kicka
    </a>
  </div>


</div>

<script type="module" src="src/main.js"></script>
<script type="module" src="src/tutorial.js"></script>
<script type="module" src="src/wasd-guzik.js"></script>
</body>
</html>
